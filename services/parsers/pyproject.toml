[project]
name = "parsers"
version = "0.1.0"
description = "Price comparison service for board games."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    # Общие контракты с catalog — IngestRequest/IngestOfferIn.
    # Workspace-source берёт из packages/shared-py (см. корневой pyproject.toml).
    "bg-shared",
    # HTML-парсинг для avito.ru (фолбэк при отсутствии embedded JSON)
    "beautifulsoup4>=4.12",
    # TLS-impersonation для обхода Qrator на avito.ru без браузера.
    # curl-cffi использует libcurl + BoringSSL и точно имитирует Chrome TLS handshake.
    "curl-cffi>=0.7",
]

[project.optional-dependencies]
# Headless Chromium для сайтов с JS-рендерингом и антибот-защитой
playwright = ["playwright>=1.40"]
# Все зависимости разом (для разработки)
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.setuptools.packages.find]
where = ["."]
include = ["parsers*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
