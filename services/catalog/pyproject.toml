[project]
name = "boardgames-catalog"
version = "0.1.0"
description = "Catalog of board games: canonical Game entities + offers from price-parsers."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["catalog*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
