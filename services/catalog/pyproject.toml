[project]
name = "boardgames-catalog"
version = "0.1.0"
description = "Catalog of board games: canonical Game entities + offers from price-parsers."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    # Парсинг HTML карточек dicefest.ru. html.parser stdlib backend (без lxml)
    # — достаточно быстрый для ~1K страниц при rate-limit 1 req/sec.
    "beautifulsoup4>=4.12",
    # Общие контракты с parsers — IngestRequest/IngestOfferIn.
    # Workspace-source берёт из packages/shared-py (см. корневой pyproject.toml).
    "bg-shared",
    # Планировщик периодических задач (BGG sync). 3.x — стабильный API;
    # 4.x (beta) не берём — нестабильный интерфейс.
    "apscheduler>=3.10,<4",
    # Требуется FastAPI для UploadFile/Form (file upload endpoints).
    # Не transitive-зависимость fastapi — нужно указывать явно.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["catalog*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
