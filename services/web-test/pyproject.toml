[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-test"
version = "0.1.0"
description = "Debug/testing web interface for parsers"
requires-python = ">=3.12"
dependencies = [
    # `parsers` резолвится через [tool.uv.sources] в корневом pyproject.toml
    # (workspace = true) — это замена прежнего `parsers @ file:///...`
    "parsers",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
    # Требуется FastAPI для UploadFile/Form (catalog import-CSV proxy через multipart).
    # Не transitive-зависимость fastapi — нужно указывать явно.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
