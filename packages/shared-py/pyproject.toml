[project]
name = "bg-shared"
version = "0.1.0"
description = "Shared pydantic contracts for boardgames-platform services."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bg_shared*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
