<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parser Monitor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 24px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }

  header h1 { font-size: 1.25rem; font-weight: 600; color: #f8fafc; }

  .meta {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.8rem;
    color: #64748b;
  }

  button#refresh {
    background: #1e293b;
    border: 1px solid #334155;
    color: #94a3b8;
    border-radius: 6px;
    padding: 4px 12px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  button#refresh:hover { background: #273344; color: #e2e8f0; }

  /* ---- Cards ---- */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
    margin-bottom: 28px;
  }

  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 18px 20px;
  }

  .card-label {
    font-size: 0.72rem;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: .05em;
    margin-bottom: 8px;
  }

  .card-value {
    font-size: 2rem;
    font-weight: 700;
    color: #f8fafc;
    line-height: 1;
  }

  .card-sub {
    font-size: 0.75rem;
    color: #475569;
    margin-top: 4px;
  }

  /* ---- Section ---- */
  section {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    margin-bottom: 20px;
    overflow: hidden;
  }

  section h2 {
    font-size: 0.85rem;
    font-weight: 600;
    color: #94a3b8;
    padding: 14px 20px;
    border-bottom: 1px solid #334155;
    text-transform: uppercase;
    letter-spacing: .05em;
  }

  /* ---- Store table ---- */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }

  th {
    text-align: left;
    padding: 10px 20px;
    font-size: 0.72rem;
    color: #64748b;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: .04em;
    border-bottom: 1px solid #334155;
  }

  td { padding: 12px 20px; border-bottom: 1px solid #1e293b; color: #cbd5e1; }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #243147; }

  .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 8px;
    flex-shrink: 0;
  }
  .dot-green  { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
  .dot-yellow { background: #eab308; box-shadow: 0 0 6px #eab30888; }
  .dot-red    { background: #ef4444; box-shadow: 0 0 6px #ef444488; }
  .dot-gray   { background: #475569; }

  .store-name { display: flex; align-items: center; }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.72rem;
    font-weight: 600;
  }
  .badge-green  { background: #14532d; color: #4ade80; }
  .badge-yellow { background: #422006; color: #fbbf24; }
  .badge-red    { background: #450a0a; color: #f87171; }
  .badge-gray   { background: #1e293b; color: #64748b; }

  /* ---- Errors list ---- */
  .error-list { list-style: none; }

  .error-item {
    display: grid;
    grid-template-columns: 140px 100px 1fr;
    gap: 16px;
    align-items: center;
    padding: 11px 20px;
    border-bottom: 1px solid #0f1117;
    font-size: 0.83rem;
  }

  .error-item:last-child { border-bottom: none; }
  .error-item:hover { background: #243147; }

  .error-ts { color: #475569; font-variant-numeric: tabular-nums; }
  .error-slug { color: #94a3b8; font-weight: 500; }
  .error-msg { color: #ef4444; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .empty { padding: 24px 20px; color: #475569; font-size: 0.85rem; }

  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid #334155;
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin-left: 6px;
    vertical-align: middle;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>⬡ Board Game Parser &mdash; Monitor</h1>
  <div class="meta">
    <span id="updated">—</span>
    <button id="refresh" onclick="load()">⟳ Обновить</button>
  </div>
</header>

<!-- Карточки сводки -->
<div class="cards" id="cards">
  <div class="card"><div class="card-label">Запросов / 24ч</div><div class="card-value" id="c-total">—</div></div>
  <div class="card"><div class="card-label">Cache hit rate</div><div class="card-value" id="c-cache">—</div><div class="card-sub" id="c-cache-sub"></div></div>
  <div class="card"><div class="card-label">Ср. время ответа</div><div class="card-value" id="c-avg">—</div></div>
  <div class="card"><div class="card-label">Ошибок парсеров</div><div class="card-value" id="c-errors">—</div></div>
</div>

<!-- Здоровье парсеров -->
<section>
  <h2>Здоровье парсеров (24ч)</h2>
  <table>
    <thead><tr>
      <th>Магазин</th>
      <th>Статус</th>
      <th>Успешно</th>
      <th>Ср. время</th>
      <th>Последний успех</th>
      <th>Последняя ошибка</th>
    </tr></thead>
    <tbody id="store-tbody"><tr><td colspan="6" class="empty">Загрузка…</td></tr></tbody>
  </table>
</section>

<!-- Последние ошибки -->
<section>
  <h2>Последние ошибки</h2>
  <ul class="error-list" id="error-list">
    <li class="error-item"><span class="error-ts" colspan="3">Загрузка…</span></li>
  </ul>
</section>

<script>
const fmtMs = ms => ms == null ? '—' : ms < 1000 ? `${ms} мс` : `${(ms/1000).toFixed(1)} с`;
const fmtTs = iso => iso ? new Date(iso).toLocaleTimeString('ru', {hour:'2-digit', minute:'2-digit', second:'2-digit'}) : '—';
const fmtDate = iso => iso ? new Date(iso).toLocaleString('ru', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}) : '—';

function dotClass(rate) {
  if (rate == null) return 'dot-gray';
  if (rate >= 80) return 'dot-green';
  if (rate >= 50) return 'dot-yellow';
  return 'dot-red';
}
function badgeClass(rate) {
  if (rate == null) return 'badge-gray';
  if (rate >= 80) return 'badge-green';
  if (rate >= 50) return 'badge-yellow';
  return 'badge-red';
}

async function load() {
  document.getElementById('updated').innerHTML = 'Загрузка… <span class="spinner"></span>';

  const [stats, stores, errors] = await Promise.all([
    fetch('/api/stats').then(r => r.json()).catch(() => null),
    fetch('/api/stats/stores').then(r => r.json()).catch(() => []),
    fetch('/api/stats/errors').then(r => r.json()).catch(() => []),
  ]);

  // Карточки
  if (stats) {
    document.getElementById('c-total').textContent = stats.total_requests;
    document.getElementById('c-cache').textContent = stats.cache_hit_rate + '%';
    document.getElementById('c-cache-sub').textContent =
      `${stats.cache_hits} cache / ${stats.network_hits} network`;
    document.getElementById('c-avg').textContent = fmtMs(stats.avg_response_ms);
    document.getElementById('c-errors').textContent = stats.total_errors;
  }

  // Таблица парсеров
  const tbody = document.getElementById('store-tbody');
  if (!stores.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">Нет данных за 24 часа</td></tr>';
  } else {
    tbody.innerHTML = stores.map(s => {
      const rate = s.success_rate_24h;
      const dc = dotClass(rate);
      const bc = badgeClass(rate);
      const lastErr = s.last_error ? `${fmtDate(s.last_error.ts)}: ${s.last_error.msg || ''}` : '—';
      return `
        <tr>
          <td><span class="store-name"><span class="dot ${dc}"></span>${s.store_slug}</span></td>
          <td><span class="badge ${bc}">${rate}%</span></td>
          <td>${s.success_count_24h} / ${s.total_calls_24h}</td>
          <td>${fmtMs(s.avg_response_ms)}</td>
          <td>${fmtDate(s.last_success)}</td>
          <td style="color:#64748b;font-size:.78rem;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${lastErr}">${lastErr}</td>
        </tr>`;
    }).join('');
  }

  // Список ошибок
  const list = document.getElementById('error-list');
  if (!errors.length) {
    list.innerHTML = '<li class="empty">Ошибок нет 🎉</li>';
  } else {
    list.innerHTML = errors.map(e => `
      <li class="error-item">
        <span class="error-ts">${fmtDate(e.ts)}</span>
        <span class="error-slug">${e.store_slug}</span>
        <span class="error-msg" title="${e.error || ''}">${e.error || '—'}</span>
      </li>`).join('');
  }

  document.getElementById('updated').textContent = 'Обновлено: ' + fmtTs(new Date().toISOString());
}

load();
setInterval(load, 30_000);
</script>
</body>
</html>
