# Единый docker-compose для всего монорепо.
#
# Profiles позволяют поднимать подмножества сервисов:
#   docker compose --profile minimal up -d          # только postgres
#   docker compose --profile catalog up -d          # postgres + catalog
#   docker compose --profile full up -d             # всё (postgres+catalog+parsers+web-test)
#   docker compose --profile browser up -d          # только browser-as-a-service
#   docker compose --profile full --profile browser up -d  # full + browser
#
# Все сервисы общаются по именам через сеть `bg`. Внешние порты можно
# переопределять переменными в .env (например POSTGRES_PORT=5434).

name: boardgames-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: bg-postgres
    # `command:` пробрасывается в entrypoint postgres-image: для arg'а 'postgres'
    # docker-entrypoint.sh вызывает 'postgres "$@"', и `-c key=value` ставит
    # параметры конфигурации. log_statement=mod пишет в логи все INSERT/UPDATE/
    # DELETE/TRUNCATE/CREATE/DROP/ALTER (но НЕ SELECT — поэтому шум умеренный).
    # Это даёт audit-trail на случай неожиданных потерь данных.
    # Альтернативные значения: 'none' (default), 'ddl' (только DDL),
    # 'all' (включая SELECT — очень шумно).
    command:
      - postgres
      - -c
      - log_statement=mod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-catalog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catalog}
      POSTGRES_DB: ${POSTGRES_DB:-catalog}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # init.sql выполняется один раз при создании volume — ставит расширения
      # pg_trgm и unaccent. Если нужно перезапустить — `docker compose down -v`
      # и заново. Для прод-миграций — Alembic в catalog'е, не init.sql.
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-catalog} -d ${POSTGRES_DB:-catalog}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - bg
    profiles: ["minimal", "catalog", "full"]

  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    image: boardgames-catalog:latest
    container_name: bg-catalog
    ports:
      - "${CATALOG_PORT:-8002}:8002"
    environment:
      # Внутри сети bg сервис ходит на postgres:5432 (имя сервиса).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-catalog}:${POSTGRES_PASSWORD:-catalog}@postgres:5432/${POSTGRES_DB:-catalog}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REQUIRE_AUTH: ${REQUIRE_AUTH:-0}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - bg
    profiles: ["catalog", "full"]

  parsers:
    build:
      context: .
      dockerfile: services/parsers/Dockerfile
    image: boardgames-parsers:latest
    container_name: bg-parsers
    ports:
      - "${PARSERS_PORT:-8001}:8001"
    environment:
      DB_PATH: /data/prices.sqlite
      CACHE_TTL_HOURS: ${CACHE_TTL_HOURS:-4}
      ENABLE_RAW_SNAPSHOTS: ${ENABLE_RAW_SNAPSHOTS:-}
      # В сети bg catalog доступен по имени сервиса.
      CATALOG_INGEST_URL: http://catalog:8002/ingest/offers
      CATALOG_API_KEY: ${CATALOG_API_KEY:-}
      # Опциональный browser-as-a-service. Если задан — parsers инициализируют
      # BrowserClient и вешают его на app.state.browser_client.
      # Используется при запуске с --profile browser.
      BROWSER_SERVICE_URL: ${BROWSER_SERVICE_URL:-}
    volumes:
      - prices-data:/data
    depends_on:
      catalog:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bg
    profiles: ["full"]

  web-test:
    build:
      # Root-context: Dockerfile делает COPY и из services/parsers/, и из
      # services/web-test/. Единственный валидный родитель обоих путей —
      # корень монорепо. См. .dockerignore для исключений из build context.
      context: .
      dockerfile: services/web-test/Dockerfile
    image: boardgames-web-test:latest
    container_name: bg-web-test
    ports:
      - "${WEB_TEST_PORT:-8000}:8000"
    environment:
      DB_PATH: /data/portal.sqlite
      PARSERS_API_URL: http://parsers:8001
      CATALOG_API_URL: http://catalog:8002
      CATALOG_API_KEY: ${CATALOG_API_KEY:-}
      # PG* читает сам pg_dump (см. man) — используется в /api/catalog/backup.
      # Тот же набор credentials, что у postgres-сервиса; никаких новых секретов.
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-catalog}
      PGPASSWORD: ${POSTGRES_PASSWORD:-catalog}
      PGDATABASE: ${POSTGRES_DB:-catalog}
      BACKUP_DIR: /backups
    volumes:
      - portal-data:/data
      # Bind на host: дампы видно из Finder/IDE без `docker cp`. Папка в
      # .gitignore (см. d3659a3). Создастся автоматически при `up`.
      - ./.scratch/backups:/backups
    depends_on:
      - parsers
      - catalog
    restart: unless-stopped
    networks:
      - bg
    profiles: ["full"]

  browser:
    build:
      context: .
      dockerfile: services/browser/Dockerfile
    image: boardgames-browser:latest
    container_name: bg-browser
    ports:
      - "${BROWSER_PORT:-8003}:8003"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Ограничивает параллельные BrowserContext (~150-200 MB RAM каждый).
      BROWSER_MAX_CONCURRENT: ${BROWSER_MAX_CONCURRENT:-3}
      # Прокси для всех fetch-запросов. Авито и другие сайты с GeoIP-блокировкой
      # требуют RU-прокси. Пример: socks5://user:pass@proxy.ru:1080
      BROWSER_PROXY_URL: ${BROWSER_PROXY_URL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Playwright + Chromium долго стартуют при первом запуске контейнера.
      start_period: 60s
    restart: unless-stopped
    networks:
      - bg
    profiles: ["browser"]

volumes:
  pgdata:
  prices-data:
  portal-data:

networks:
  bg:
    driver: bridge
