[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parsers-web-test"
version = "0.1.0"
description = "Debug/testing web interface for parsers"
requires-python = ">=3.11"
dependencies = [
    "parsers @ file:///Users/vitaliy/Projects/parsers",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true
