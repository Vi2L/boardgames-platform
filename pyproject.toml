# Корневой pyproject.toml монорепо boardgames-platform.
#
# Этот файл объявляет uv workspace: каждый сервис в `services/*` — отдельный
# member со своим pyproject.toml, но устанавливаются они в один общий
# `.venv/` в корне через `uv sync`. В будущем сюда же приедут members из
# `packages/` (общие pydantic-схемы и т.п.).
#
# Подробности — в CLAUDE.md.

[project]
name = "boardgames-platform"
version = "0.1.0"
description = "Monorepo: catalog + parsers + debug portal for the boardgames platform."
requires-python = ">=3.12"
# Корень не публикуется как пакет, но `name`/`version` нужны для метаданных.

# === uv workspace ===
[tool.uv.workspace]
members = [
    "services/catalog",
    "services/parsers",
    "services/web-test",
    "packages/shared-py",
]

# Когда любой member видит зависимость "parsers" / "bg-shared", uv берёт
# её из workspace, а не с PyPI. Это и есть замена прежнего
# `parsers @ file:///...` в web-test и единственного источника правды
# для общих pydantic-схем.
[tool.uv.sources]
parsers = { workspace = true }
bg-shared = { workspace = true }

# === Общие dev-зависимости (PEP 735 dependency-groups) ===
# Ставятся для всего workspace командой `uv sync --group dev` (или просто
# `uv sync`, если default-groups содержит "dev"). Видны во всех members.
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

# === Линтер/форматтер ===
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "**/.venv",
    "**/dist",
    "**/build",
    "services/web-test/frontend",
    "services/catalog/alembic/versions",
]

[tool.ruff.lint]
# Базовый набор: pyflakes (F), pycodestyle errors/warnings (E, W), isort (I)
select = ["F", "E", "W", "I"]

# === Тесты ===
# Корневого `[tool.pytest.ini_options]` нет специально: иначе pytest при
# любом запуске из корня собирает test_*.py из всех services/*/tests и
# падает с ImportPathMismatchError — у каждого сервиса свой conftest.py,
# и pluggy не может зарегистрировать два модуля с одинаковым именем
# `tests.conftest` в одной pytest-сессии.
#
# Workflow для тестов:
#   cd services/catalog && uv run pytest    # тесты одного сервиса
#   bin/test-all.sh                         # все сервисы (отдельные процессы pytest)
#
# Per-service config (testpaths, asyncio_mode) живёт в каждом
# services/*/pyproject.toml — pytest автоматически их подхватит при
# запуске из service-папки.
